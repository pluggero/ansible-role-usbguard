---
role_name_check: 1
dependency:
  name: galaxy
driver:
  name: vagrant
platforms:
  - name: instance
    box: "${MOLECULE_DISTRO:-debian12}-ansible"
    box_version: "${MOLECULE_VAGRANT_BOX_VERSION:-2026.09.27}"
    box_url: "${VAGRANT_BOX_S3_ENDPOINT}/${VAGRANT_BOX_S3_BUCKET}/${MOLECULE_DISTRO:-debian12}-ansible/metadata.json"
provisioner:
  name: ansible
  playbooks:
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
